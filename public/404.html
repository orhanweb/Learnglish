<!-- public/404.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var pathSegmentsToKeep = 1;
        var location = window.location;
        var redirectPath =
          location.protocol +
          '//' +
          location.hostname +
          (location.port ? ':' + location.port : '') +
          location.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          location.pathname
            .split('/')
            .slice(1 + pathSegmentsToKeep)
            .join('/') +
          location.search.replace(/&/g, '~and~') +
          location.hash;

        location.replace(redirectPath);
      })();
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
